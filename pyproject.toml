[project]
name = "ragkb"
version = "0.1.0"
description = "诊断知识库 · 工业级文档处理流水线(Markdown FAQ → QA CSV + SOP)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "typer>=0.12,<1.0",
    "rapidfuzz>=3.9,<4.0",
    "pypdf>=5.0,<7.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "sse-starlette>=2.1,<3.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ragkb = "ragkb.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
