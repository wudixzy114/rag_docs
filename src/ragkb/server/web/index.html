<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG 文档流水线</title>
<style>
  :root {
    --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f8fafb; --line:#d9dee5;
    --text:#18212b; --muted:#647180; --quiet:#8994a1; --accent:#1769aa;
    --accent-soft:#e8f2fa; --ok:#16794b; --ok-soft:#e8f5ee; --warn:#9a6200;
    --warn-soft:#fff3d9; --error:#b42318; --error-soft:#fdecea; --ink:#263746;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
  body { font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  button, input, select { font:inherit; }
  button { letter-spacing:0; }
  .app-header { height:58px; padding:0 18px; display:flex; align-items:center; gap:14px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .brand { display:flex; align-items:center; gap:10px; min-width:250px; }
  .brand-mark { width:28px; height:28px; display:grid; place-items:center; background:var(--ink); color:#fff; border-radius:6px; font-weight:700; font-size:12px; }
  .brand strong { display:block; font-size:14px; }
  .brand span { display:block; color:var(--muted); font-size:11px; }
  .connection { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
  .connection i { width:7px; height:7px; border-radius:50%; background:var(--quiet); }
  .connection.online i { background:var(--ok); }
  .connection.offline i { background:var(--error); }
  .header-spacer { flex:1; }
  .header-model { color:var(--muted); font-size:12px; max-width:270px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { min-height:34px; border:1px solid var(--line); color:var(--text); background:var(--surface); border-radius:6px; padding:6px 10px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .btn:hover { border-color:#9eabb8; background:var(--surface-2); }
  .btn.primary { color:#fff; border-color:var(--accent); background:var(--accent); }
  .btn.danger { color:var(--error); }
  .btn.icon { width:34px; padding:0; font-size:16px; }
  .btn:disabled { cursor:not-allowed; opacity:.48; }
  .shell { height:calc(100vh - 58px); display:grid; grid-template-columns:300px minmax(520px,1fr) 330px; }
  .sidebar, .activity { background:var(--surface); min-height:0; overflow:auto; }
  .sidebar { border-right:1px solid var(--line); }
  .activity { border-left:1px solid var(--line); }
  .main { min-width:0; overflow:auto; }
  .pane-head { min-height:52px; padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; position:sticky; top:0; background:var(--surface); z-index:5; }
  .pane-head h2 { font-size:13px; margin:0; }
  .count { color:var(--muted); font-size:12px; }
  .search { margin:10px 12px; position:relative; }
  .search input { width:100%; height:34px; padding:6px 9px 6px 30px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); color:var(--text); }
  .search span { position:absolute; left:10px; top:7px; color:var(--quiet); }
  .doc-list { border-top:1px solid var(--line); }
  .doc-row { width:100%; text-align:left; border:0; border-bottom:1px solid #edf0f3; background:var(--surface); padding:11px 12px; cursor:pointer; }
  .doc-row:hover { background:var(--surface-2); }
  .doc-row.selected { background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .doc-line { display:flex; align-items:flex-start; gap:8px; }
  .status-dot { width:8px; height:8px; margin-top:6px; border-radius:50%; flex:none; background:var(--quiet); }
  .status-dot.running { background:var(--accent); animation:pulse 1.2s infinite; }
  .status-dot.done { background:var(--ok); }
  .status-dot.failed { background:var(--error); }
  .status-dot.interrupted { background:var(--warn); }
  .status-dot.partial { background:var(--warn); }
  .status-dot.awaiting_review { background:var(--warn); }
  .status-dot.excluded { background:var(--quiet); }
  .status-dot.pinned { background:#6d4bb3; }
  .doc-name { min-width:0; flex:1; font-weight:600; font-size:13px; overflow-wrap:anywhere; }
  .doc-status { color:var(--muted); font-size:11px; flex:none; }
  .doc-meta { margin:5px 0 0 16px; color:var(--muted); display:flex; gap:10px; font-size:11px; }
  .mini-progress { height:3px; background:#e7ebef; margin:8px 0 0 16px; }
  .mini-progress i { display:block; height:100%; background:var(--accent); }
  .summary-band { min-height:72px; padding:10px 18px; display:grid; grid-template-columns:repeat(5,minmax(90px,1fr)); gap:1px; background:var(--line); border-bottom:1px solid var(--line); }
  .total-progress { padding:14px 18px 4px; border-bottom:1px solid #edf0f3; }
  .tp-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:7px; }
  .tp-title { font-size:12px; color:var(--muted); font-weight:600; }
  .tp-title b { color:var(--text); }
  .tp-pct { font-size:20px; font-weight:700; line-height:1; color:var(--ink); }
  .tp-pct span { font-size:12px; font-weight:500; color:var(--muted); margin-left:2px; }
  .tp-bar { height:9px; border-radius:6px; background:#e7ebef; overflow:hidden; display:flex; }
  .tp-bar i { height:100%; display:block; transition:width .45s ease; }
  .tp-bar .seg-done { background:var(--ok); }
  .tp-bar .seg-running { background:var(--accent); }
  .tp-bar .seg-failed { background:var(--error); }
  .tp-legend { margin-top:7px; display:flex; flex-wrap:wrap; gap:12px; color:var(--muted); font-size:11px; }
  .tp-legend span { display:inline-flex; align-items:center; gap:5px; }
  .tp-legend i { width:8px; height:8px; border-radius:2px; flex:none; }
  .tp-sched { margin-top:9px; padding-top:9px; border-top:1px dashed #e0e5ea; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tp-sched-label { font-size:11px; color:var(--muted); font-weight:600; }
  .tp-sched-num { font-size:11px; color:var(--text); }
  .tp-sched-num b { font-size:14px; color:var(--accent); }
  .tp-sched-phase { font-size:10px; padding:1px 7px; border-radius:10px; }
  .tp-sched-phase.is-slow { background:var(--accent-soft); color:var(--accent); }
  .tp-sched-phase.is-avoid { background:var(--warn-soft); color:var(--warn); }
  .tp-sched-bar { position:relative; flex:1; min-width:120px; height:7px; border-radius:5px; background:#e7ebef; overflow:hidden; }
  .tp-sched-bar .sched-fill { position:absolute; left:0; top:0; height:100%; background:var(--accent); border-radius:5px; transition:width .4s ease; }
  .tp-sched-bar .sched-limit { position:absolute; top:-1px; width:2px; height:9px; background:var(--ink); opacity:.55; border-radius:1px; }
  .sched-models { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .sched-chip { font-size:10px; padding:2px 7px; border-radius:10px; background:#eef1f4; color:var(--muted); border:1px solid transparent; }
  .sched-chip.busy { background:var(--accent-soft); color:var(--accent); border-color:#bcdcf1; }
  .sched-chip b { color:var(--text); }
  .sched-chip.busy b { color:var(--accent); }
  .metric { background:var(--surface); padding:8px 12px; }
  .metric span { display:block; color:var(--muted); font-size:11px; }
  .metric strong { display:block; margin-top:2px; font-size:19px; line-height:1.2; }
  .error-banner { margin:14px 18px 0; padding:10px 12px; background:var(--error-soft); border:1px solid #f2c7c3; color:var(--error); border-radius:6px; display:none; }
  .detail-head { padding:16px 18px 12px; display:flex; align-items:flex-start; gap:14px; }
  .detail-title { min-width:0; flex:1; }
  .detail-title h1 { margin:0; font-size:18px; overflow-wrap:anywhere; }
  .detail-title p { margin:3px 0 0; color:var(--muted); font-size:12px; }
  .detail-actions { display:flex; gap:7px; }
  .pipeline { padding:0 18px 16px; display:grid; grid-template-columns:repeat(8,minmax(68px,1fr)); }
  .stage { position:relative; padding:0 8px 0 0; min-width:0; }
  .stage:not(:last-child)::after { content:""; position:absolute; top:10px; left:22px; right:0; height:1px; background:var(--line); }
  .stage-node { width:21px; height:21px; position:relative; z-index:1; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; border-radius:50%; font-size:11px; color:var(--quiet); }
  .stage.done .stage-node { color:#fff; background:var(--ok); border-color:var(--ok); }
  .stage.running .stage-node { color:#fff; background:var(--accent); border-color:var(--accent); animation:pulse 1.2s infinite; }
  .stage.failed .stage-node { color:#fff; background:var(--error); border-color:var(--error); }
  .stage-name { margin-top:5px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stage-detail { font-size:10px; color:var(--quiet); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabs { display:flex; gap:2px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:4; }
  .tab { border:0; border-bottom:2px solid transparent; background:transparent; padding:10px 12px 9px; color:var(--muted); cursor:pointer; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  .toolbar { padding:10px 18px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #edf0f3; }
  .toolbar input { width:min(360px,100%); height:32px; border:1px solid var(--line); border-radius:6px; padding:5px 9px; background:var(--surface); }
  .unit-list { background:var(--surface); }
  .unit-row { padding:14px 18px; border-bottom:1px solid #e8ecf0; }
  .unit-top { display:flex; gap:10px; align-items:flex-start; }
  .unit-title { flex:1; font-weight:600; overflow-wrap:anywhere; }
  .unit-answer { color:#344454; white-space:pre-wrap; margin-top:8px; font-size:13px; max-height:240px; overflow:auto; }
  .unit-meta { margin-top:9px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:11px; }
  .chip { display:inline-flex; align-items:center; min-height:22px; padding:2px 7px; border-radius:5px; font-size:11px; background:#eef1f4; color:var(--muted); }
  .chip.ok { background:var(--ok-soft); color:var(--ok); }
  .chip.warn { background:var(--warn-soft); color:var(--warn); }
  .chip.error { background:var(--error-soft); color:var(--error); }
  .reason { margin-top:8px; padding:8px 10px; border-left:3px solid var(--error); background:#fff8f7; color:#7e2d27; font-size:12px; white-space:pre-wrap; }
  .decision-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .audit-stage { border-bottom:1px solid var(--line); }
  .audit-stage summary { padding:12px 18px; cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:600; }
  .audit-stage summary span { color:var(--muted); font-size:11px; font-weight:400; }
  .audit-body { padding:0 18px 18px; }
  .audit-columns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .audit-panel { min-width:0; }
  .audit-label { color:var(--muted); font-size:11px; margin-bottom:4px; }
  .audit-text { margin:0; padding:10px; max-height:380px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; background:#f6f8fa; border:1px solid var(--line); border-radius:4px; font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .audit-diff { margin-top:10px; }
  .empty { padding:48px 20px; color:var(--muted); text-align:center; }
  .event-list { padding-bottom:20px; }
  .event { padding:10px 12px; border-bottom:1px solid #edf0f3; }
  .event-top { display:flex; gap:8px; align-items:center; }
  .event-kind { width:7px; height:7px; border-radius:50%; background:var(--quiet); flex:none; }
  .event.error .event-kind, .event.failed .event-kind { background:var(--error); }
  .event.done .event-kind { background:var(--ok); }
  .event.running .event-kind { background:var(--accent); }
  .event.fallback .event-kind { background:var(--warn); }
  .event.fallback { background:var(--warn-soft); }
  .event-topic { flex:1; font-size:12px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .event-time { color:var(--quiet); font-size:10px; }
  .event-message { margin:3px 0 0 15px; color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
  .toast { position:fixed; right:18px; bottom:18px; max-width:420px; padding:10px 12px; color:#fff; background:var(--ink); border-radius:6px; box-shadow:0 8px 24px #23303d33; z-index:50; display:none; }
  .toast.error { background:var(--error); }
  @keyframes pulse { 50% { opacity:.45; } }
  @media (max-width:1180px) {
    .shell { grid-template-columns:280px minmax(500px,1fr); }
    .activity { display:none; }
    .header-model { display:none; }
  }
  @media (max-width:760px) {
    .app-header { height:auto; min-height:58px; flex-wrap:wrap; padding:8px 10px; }
    .brand { min-width:0; flex:1; }
    .connection { order:3; width:100%; }
    .shell { height:auto; display:block; }
    .sidebar { border-right:0; max-height:280px; border-bottom:1px solid var(--line); }
    .summary-band { grid-template-columns:repeat(3,1fr); padding:8px; }
    .metric { padding:7px; }
    .pipeline { grid-template-columns:repeat(4,1fr); row-gap:12px; }
    .stage:nth-child(4)::after { display:none; }
    .detail-head { padding:14px 12px; }
    .detail-actions { flex-direction:column; }
    .tabs, .toolbar { padding-left:12px; padding-right:12px; }
    .unit-row { padding:12px; }
    .audit-columns { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><div class="brand-mark">RAG</div><div><strong>文档清洗流水线</strong><span>source-faithful pipeline</span></div></div>
  <div class="connection" id="connection"><i></i><span>正在连接</span></div>
  <div class="header-spacer"></div>
  <div class="header-model" id="modelInfo" title="当前模型路由"></div>
  <button class="btn" id="scanBtn" title="只执行预处理扫描，不调用模型"><span>⌁</span><span>预检</span></button>
  <button class="btn" id="exportBtn" title="导出已通过审核的结果"><span>⇩</span><span>导出</span></button>
  <button class="btn primary" id="runBtn" title="运行全部文档"><span>▶</span><span>运行全部</span></button>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="pane-head"><h2>文档队列</h2><span class="count" id="docCount"></span></div>
    <div class="search"><span>⌕</span><input id="docSearch" placeholder="搜索文档"></div>
    <div class="doc-list" id="docList"></div>
  </aside>

  <main class="main">
    <section class="total-progress" id="totalProgress"></section>
    <section class="summary-band" id="metrics"></section>
    <div class="error-banner" id="errorBanner"></div>
    <section class="detail-head">
      <div class="detail-title"><h1 id="detailTitle">全部文档</h1><p id="detailMeta"></p></div>
      <div class="detail-actions">
        <button class="btn icon" id="pinBtn" title="固定或取消固定">◇</button>
        <button class="btn" id="retryBtn" title="重新处理当前文档"><span>↻</span><span>重试</span></button>
      </div>
    </section>
    <section class="pipeline" id="pipeline"></section>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="qa">QA <span id="qaCount">0</span></button>
      <button class="tab" data-tab="sop">SOP <span id="sopCount">0</span></button>
      <button class="tab" data-tab="failed">失败 <span id="failedCount">0</span></button>
      <button class="tab" data-tab="decisions">人工待办 <span id="decisionCount">0</span></button>
      <button class="tab" data-tab="audit">阶段审计</button>
    </nav>
    <div class="toolbar"><input id="unitSearch" placeholder="筛选当前结果"><span class="count" id="resultCount"></span></div>
    <section class="unit-list" id="unitList"></section>
  </main>

  <aside class="activity">
    <div class="pane-head"><h2>实时事件</h2><span class="count" id="eventCount"></span></div>
    <div class="event-list" id="eventList"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const STAGES = [
  ['preflight','预检'], ['parse','解析'], ['vision','图片'], ['classify','分类'], ['extract','抽取'],
  ['validate','校验'], ['regenerate','重生成'], ['review','审核']
];
const STATUS_TEXT = {pending:'待处理',running:'运行中',done:'完成',failed:'失败',partial:'待自动恢复',pinned:'已固定',skipped:'已跳过',interrupted:'已中断',awaiting_review:'待人工',excluded:'已排除'};
const S = {docs:{}, units:{}, stages:{}, events:[], errors:[], decisions:[], audits:{}, failureSummary:{}, models:{}, usage:{}, lastRun:{}, concurrency:{}, selected:null, tab:'qa', running:false, seq:0};
const $ = selector => document.querySelector(selector);

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : ''; }
function fmtNum(n) { return Number(n || 0).toLocaleString('zh-CN'); }
function topicOf(unit) { return unit.sources?.[0]?.topic || '_unknown'; }
function unitsFor(topic) { return topic ? (S.units[topic] || []) : Object.values(S.units).flat(); }
function approved(unit) { return unit.unit_kind === 'qa' && (unit.publication_status || (unit.semantic_ok ? 'approved' : 'failed_review')) === 'approved'; }
function failed(unit) { return unit.unit_kind === 'qa' && !approved(unit); }

function toast(message, isError=false) {
  const node = $('#toast'); node.textContent = message; node.className = 'toast' + (isError ? ' error' : ''); node.style.display='block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => node.style.display='none', 3600);
}
async function api(path, body={}) {
  let response;
  try { response = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch (error) { toast('网络请求失败：' + error.message, true); throw error; }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) { const message = data.detail || `请求失败 (${response.status})`; toast(message, true); throw new Error(message); }
  return data;
}

function hydrate(data) {
  S.running = Boolean(data.running);
  S.docs = Object.fromEntries((data.docs || []).map(doc => [doc.topic, {...S.docs[doc.topic], ...doc}]));
  S.stages = data.stages || S.stages;
  S.errors = data.errors || [];
  S.decisions = data.decisions || [];
  S.failureSummary = data.failure_summary || {};
  S.models = data.models || {};
  S.usage = data.usage || {};
  S.lastRun = data.last_run || {};
  S.concurrency = data.concurrency || {};
  const nextUnits = {};
  for (const unit of data.results?.qa || []) {
    const topic = topicOf(unit); (nextUnits[topic] ||= []).push({...unit,unit_kind:'qa'});
  }
  for (const unit of data.results?.sop || []) {
    const topic = topicOf(unit); (nextUnits[topic] ||= []).push({...unit,unit_kind:'sop'});
  }
  S.units = nextUnits;
  S.events = (data.events || []).slice(-300);
  S.seq = Math.max(S.seq, ...S.events.map(event => event.seq || 0), 0);
  const topics = Object.keys(S.docs).sort();
  if (!S.selected || !S.docs[S.selected]) S.selected = topics.find(t => S.docs[t].status === 'running') || topics[0] || null;
  render();
}

async function refreshState(silent=false) {
  try {
    const response = await fetch('/api/state',{cache:'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    hydrate(await response.json());
  } catch (error) { if (!silent) toast('状态同步失败：' + error.message, true); setConnection('offline','同步失败'); }
}

function setConnection(kind, text) {
  const node = $('#connection'); node.className = 'connection ' + kind; node.querySelector('span').textContent = text;
}

function onEvent(event) {
  if (!event || (event.seq && event.seq <= S.seq)) return;
  S.seq = Math.max(S.seq, event.seq || 0);
  // Concurrency is a high-frequency live gauge, not a log line: update state and
  // repaint, but never let it into the scrolling event feed.
  if (event.kind === 'concurrency') {
    S.concurrency = {...event.data, ts: event.ts};
    renderTotalProgress();
    return;
  }
  S.events.push(event); if (S.events.length > 300) S.events.shift();
  const data = event.data || {}, topic = event.topic;
  if (event.kind === 'doc_status') {
    S.docs[topic] ||= {topic}; S.docs[topic].status = data.status;
    if (data.status === 'pinned') S.docs[topic].pinned = true;
    if (data.status === 'unpinned') S.docs[topic].pinned = false;
  } else if (event.kind === 'stage') {
    S.stages[topic] ||= {}; S.stages[topic][data.stage || 'unknown'] = {...data,seq:event.seq,ts:event.ts};
  } else if (event.kind === 'error') {
    S.errors.push(event);
  } else if (event.kind === 'run_status') {
    S.lastRun = {...data,seq:event.seq,ts:event.ts};
    S.running = data.status === 'started';
    if (data.status === 'done' || data.status === 'failed') refreshState(true);
    if (data.status === 'exported') toast(`导出完成：${data.qa_units || 0} QA / ${data.sop_files || 0} SOP`);
  } else if (event.kind === 'decision_required' || event.kind === 'human_decision') {
    refreshState(true);
  }
  render();
}

function render() {
  renderTotalProgress(); renderHeader(); renderMetrics(); renderDocs(); renderDetail(); renderEvents();
}
function renderTotalProgress() {
  const docs = Object.values(S.docs), total = docs.length;
  const node = $('#totalProgress');
  if (!total) { node.innerHTML = ''; return; }
  // Each doc contributes an equal 1/total slice. done/pinned/skipped = full;
  // running = its per-stage progress fraction; failed counts as resolved (not
  // stuck) but is surfaced separately in red; pending = 0.
  const DONE = new Set(['done','pinned','skipped','excluded']);
  let doneUnits = 0, runningUnits = 0, failedCount = 0, doneCount = 0, runningCount = 0, pendingCount = 0;
  for (const doc of docs) {
    const status = doc.status || 'pending';
    if (DONE.has(status)) { doneUnits += 1; doneCount += 1; }
    else if (status === 'failed' || status === 'interrupted' || status === 'partial') { failedCount += 1; }
    else if (status === 'running') { runningUnits += docProgress(doc.topic) / 100; runningCount += 1; }
    else { pendingCount += 1; }
  }
  const donePct = doneUnits / total * 100;
  const runningPct = runningUnits / total * 100;
  const failedPct = failedCount / total * 100;
  let overall = Math.round(donePct + runningPct + failedPct);
  // A run isn't complete until the cross-doc consolidate/review/export phase
  // finishes, but per-doc statuses can all read done/failed before then (docs
  // only flip to 'done' inside consolidate). Don't show a finished 100% while
  // the run is still flagged in-flight — cap at 99% and label the tail phase.
  const runInFlight = S.running || S.lastRun?.status === 'started';
  let tailNote = '';
  if (runInFlight && overall >= 100) { overall = 99; tailNote = ' · 集约/审核中'; }
  node.innerHTML = `
    <div class="tp-head">
      <span class="tp-title">总进度 · <b>${doneCount}</b>/${total} 篇完成${runningCount?` · ${runningCount} 运行中`:''}${failedCount?` · ${failedCount} 失败`:''}${tailNote}</span>
      <span class="tp-pct">${overall}<span>%</span></span>
    </div>
    <div class="tp-bar">
      <i class="seg-done" style="width:${donePct}%"></i>
      <i class="seg-running" style="width:${runningPct}%"></i>
      <i class="seg-failed" style="width:${failedPct}%"></i>
    </div>
    <div class="tp-legend">
      <span><i style="background:var(--ok)"></i>完成 ${doneCount}</span>
      <span><i style="background:var(--accent)"></i>运行中 ${runningCount}</span>
      <span><i style="background:var(--error)"></i>失败 ${failedCount}</span>
      <span><i style="background:#e7ebef"></i>待处理 ${pendingCount}</span>
    </div>
    ${renderConcurrency()}`;
}
function renderConcurrency() {
  const c = S.concurrency || {};
  if (c.in_flight == null && c.limit == null) return '';
  const inFlight = c.in_flight || 0, limit = c.limit || 1;
  const perModel = c.per_model || {};
  const activeModels = c.active_models ?? Object.keys(perModel).length;
  // Aggregate fill: total in-flight against total allowed window across all
  // per-model buckets. The whole point of the multi-model scheduler is that this
  // sum can exceed any single model's cap.
  const fillPct = limit > 0 ? Math.min(100, inFlight / limit * 100) : 0;
  // Per-model mini-bars: one chip per active model showing its own in_flight/limit.
  const shortName = m => m.replace(/-(Preview-)?joybuilder$/,'').replace(/^Claude-/,'').replace(/^Gemini-/,'G-');
  const chips = Object.entries(perModel).map(([m, s]) => {
    const inf = s.in_flight || 0, lim = s.limit || 1;
    const busy = inf > 0;
    return `<span class="sched-chip ${busy?'busy':''}" title="${esc(m)}：并发 ${inf}/${lim}，窗口 ${s.window}">${esc(shortName(m))} <b>${inf}</b>/${lim}</span>`;
  }).join('');
  return `
    <div class="tp-sched">
      <span class="tp-sched-label">调度器并发</span>
      <span class="tp-sched-num"><b>${inFlight}</b> 并发中 · 合计窗口 ${limit} · ${activeModels} 模型并行</span>
      <div class="tp-sched-bar">
        <i class="sched-fill" style="width:${fillPct}%"></i>
      </div>
      ${chips?`<div class="sched-models">${chips}</div>`:''}
    </div>`;
}
function renderHeader() {
  $('#runBtn').disabled = S.running; $('#exportBtn').disabled = S.running; $('#scanBtn').disabled = S.running;
  $('#runBtn').innerHTML = S.running ? '<span>●</span><span>运行中</span>' : '<span>▶</span><span>运行全部</span>';
  $('#modelInfo').textContent = S.models.extract ? `抽取 ${S.models.extract} · 审核 ${S.models.review}` : '';
}
function renderMetrics() {
  const docs = Object.values(S.docs), units = Object.values(S.units).flat();
  const values = [
    ['文档', `${docs.filter(d=>d.status==='done').length}/${docs.length}`],
    ['人工待办', S.decisions.filter(d=>d.status==='pending').length],
    ['已批准 QA', units.filter(approved).length],
    ['审核失败', units.filter(failed).length],
    ['SOP', units.filter(u=>u.unit_kind==='sop').length],
  ];
  $('#metrics').innerHTML = values.map(([label,value]) => `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('');
}
function docProgress(topic) {
  const stages = S.stages[topic] || {}, relevant = STAGES.filter(([key]) => key !== 'regenerate');
  const done = relevant.filter(([key]) => stages[key]?.status === 'done').length;
  return Math.round(done / relevant.length * 100);
}
function renderDocs() {
  const query = $('#docSearch').value.trim().toLowerCase();
  const docs = Object.values(S.docs).filter(doc => !query || doc.topic.toLowerCase().includes(query)).sort((a,b) => {
    const rank={running:0,awaiting_review:1,partial:2,failed:3,interrupted:4,pending:5,done:6,pinned:7,excluded:8,skipped:9}; return (rank[a.status]??10)-(rank[b.status]??10)||a.topic.localeCompare(b.topic);
  });
  $('#docCount').textContent = `${docs.length} 篇`;
  $('#docList').innerHTML = docs.length ? docs.map(doc => {
    const status = doc.status || 'pending', progress = docProgress(doc.topic);
    return `<button class="doc-row${S.selected===doc.topic?' selected':''}" data-topic="${esc(doc.topic)}">
      <div class="doc-line"><i class="status-dot ${esc(status)}"></i><span class="doc-name">${esc(doc.topic)}</span><span class="doc-status">${esc(STATUS_TEXT[status]||status)}</span></div>
      <div class="doc-meta"><span>QA ${doc.passed||0}</span><span>失败 ${doc.rejected||0}</span><span>SOP ${doc.sop_count||0}</span></div>
      ${status==='running'?`<div class="mini-progress"><i style="width:${progress}%"></i></div>`:''}
    </button>`;
  }).join('') : '<div class="empty">没有匹配文档</div>';
}
function renderDetail() {
  const doc = S.selected ? S.docs[S.selected] : null, topic = doc?.topic || null;
  const units = unitsFor(topic);
  $('#detailTitle').textContent = topic || '全部文档';
  $('#detailMeta').textContent = doc ? `${STATUS_TEXT[doc.status] || doc.status} · ${doc.error || '最近状态已同步'}` : '汇总视图';
  $('#pinBtn').disabled = !doc || S.running; $('#retryBtn').disabled = !doc || S.running;
  $('#pinBtn').textContent = doc?.pinned ? '◆' : '◇'; $('#pinBtn').title = doc?.pinned ? '取消固定' : '固定文档';
  renderPipeline(topic);
  const qa = units.filter(approved), sop = units.filter(u=>u.unit_kind==='sop'), bad = units.filter(failed);
  const decisions=S.decisions.filter(item=>item.status==='pending'&&(!topic||item.topic===topic));
  $('#qaCount').textContent=qa.length; $('#sopCount').textContent=sop.length; $('#failedCount').textContent=bad.length; $('#decisionCount').textContent=decisions.length;
  const lastError = [...S.errors].reverse().find(error => !topic || error.topic===topic);
  const banner = $('#errorBanner');
  if (lastError) { banner.style.display='block'; banner.textContent=`${lastError.topic || '流水线'}：${lastError.data?.message || '未知错误'}`; }
  else if (doc?.error) { banner.style.display='block'; banner.textContent=doc.error; }
  else banner.style.display='none';
  if (S.tab==='decisions') renderDecisions(decisions);
  else if (S.tab==='audit') renderAudit(topic);
  else renderUnits({qa,sop,failed:bad}[S.tab] || qa);
}
function renderPipeline(topic) {
  const stages = topic ? (S.stages[topic] || {}) : {};
  $('#pipeline').innerHTML = STAGES.map(([key,label], index) => {
    const stage=stages[key]||{}, status=stage.status||'pending';
    const detail = stage.total ? `${stage.done||0}/${stage.total}` : (stage.attempt ? `第 ${stage.attempt} 次` : stage.detail||'');
    return `<div class="stage ${esc(status)}" title="${esc(stage.detail||label)}"><div class="stage-node">${status==='done'?'✓':status==='failed'?'!':index+1}</div><div class="stage-name">${esc(label)}</div><div class="stage-detail">${esc(detail)}</div></div>`;
  }).join('');
}
function renderUnits(list) {
  const query=$('#unitSearch').value.trim().toLowerCase();
  const filtered=list.filter(unit => !query || JSON.stringify(unit).toLowerCase().includes(query));
  $('#resultCount').textContent=`${filtered.length} 项`;
  if (!filtered.length) { $('#unitList').innerHTML='<div class="empty">当前视图没有结果</div>'; return; }
  $('#unitList').innerHTML=filtered.map(unit => {
    if (unit.unit_kind==='sop') {
      const questions=(unit.entry_questions||[]).map(q=>`<span class="chip">${esc(q)}</span>`).join('');
      return `<article class="unit-row"><div class="unit-top"><div class="unit-title">${esc(unit.title)}</div><span class="chip ok">SOP</span></div><div class="unit-meta">${questions}</div></article>`;
    }
    const isFailed=failed(unit), source=unit.sources?.[0];
    return `<article class="unit-row"><div class="unit-top"><div class="unit-title">${esc(unit.query)}</div><span class="chip ${isFailed?'error':'ok'}">${isFailed?'审核失败':'已批准'}</span></div>
      <div class="unit-answer">${esc(unit.answer)}</div>
      ${isFailed?`<div class="reason">${esc(unit.semantic_reason||'未通过审核')}</div>`:''}
      <div class="unit-meta"><span>重生成 ${unit.review_attempts||0}/1</span>${source?`<span>${esc(source.heading_path||source.doc_title||source.topic)}</span>`:''}${unit.review_history?.length?`<span class="chip warn">初审：${esc(unit.review_history[0])}</span>`:''}</div></article>`;
  }).join('');
}
function renderDecisions(list) {
  $('#resultCount').textContent=`${list.length} 项`;
  if (!list.length) { $('#unitList').innerHTML='<div class="empty">当前范围没有人工待办</div>'; return; }
  const labels={include:'纳入流水线',exclude:'排除',retry:'自动重试',accept:'接受现状'};
  $('#unitList').innerHTML=list.map(item=>`<article class="unit-row">
    <div class="unit-top"><div class="unit-title">${esc(item.topic)}</div><span class="chip warn">${esc(item.stage)}</span></div>
    <div class="unit-answer">${esc(item.reason)}</div>
    <div class="unit-meta">${(item.evidence||[]).map(value=>`<span>${esc(value)}</span>`).join('')}</div>
    <div class="decision-actions">${(item.options||[]).map(action=>`<button class="btn ${action===item.recommended_action?'primary':''}" data-decision="${esc(item.decision_id)}" data-action="${esc(action)}">${esc(labels[action]||action)}</button>`).join('')}</div>
  </article>`).join('');
}
async function loadAudit(topic) {
  if (!topic || S.audits[topic]) return;
  try { const response=await fetch('/api/audit?topic='+encodeURIComponent(topic),{cache:'no-store'}); if(!response.ok)throw new Error(`HTTP ${response.status}`); S.audits[topic]=await response.json(); renderDetail(); }
  catch(error){toast('审计记录读取失败：'+error.message,true);}
}
function renderAudit(topic) {
  $('#resultCount').textContent='';
  if (!topic) { $('#unitList').innerHTML='<div class="empty">请先选择一篇文档查看阶段审计</div>'; return; }
  const audit=S.audits[topic];
  if (!audit) { $('#unitList').innerHTML='<div class="empty">正在读取审计记录</div>'; loadAudit(topic); return; }
  const stages=audit.stages||{}, rows=[];
  for (const [stage,attempts] of Object.entries(stages)) for (const item of attempts) rows.push([stage,item]);
  if (!rows.length) { $('#unitList').innerHTML='<div class="empty">该文档尚无审计记录</div>'; return; }
  $('#unitList').innerHTML=rows.map(([stage,item],index)=>`<details class="audit-stage" ${index===rows.length-1?'open':''}>
    <summary>${esc(stage)} · 第 ${item.attempt} 次 <span>${esc(item.status)} · ${fmtNum(item.input_chars)} → ${fmtNum(item.output_chars)} 字符 · ${fmtTime(item.ts)}</span></summary>
    <div class="audit-body">${item.error?`<div class="reason">${esc(item.error)}</div>`:''}<div class="audit-columns">
      <div class="audit-panel"><div class="audit-label">输入 · ${esc(item.input_sha)}</div><pre class="audit-text">${esc(item.input_text)}</pre></div>
      <div class="audit-panel"><div class="audit-label">输出 · ${esc(item.output_sha)}</div><pre class="audit-text">${esc(item.output_text)}</pre></div>
    </div><div class="audit-diff"><div class="audit-label">文本差异</div><pre class="audit-text">${esc(item.diff||'无文本差异')}</pre></div></div>
  </details>`).join('');
}
function renderEvents() {
  const events=S.events.slice(-120).reverse(); $('#eventCount').textContent=`${events.length} 条`;
  $('#eventList').innerHTML=events.length ? events.map(event => {
    const data=event.data||{}, status=data.status||event.kind;
    if (event.kind==='fallback') {
      // qa→sop reclassification — always visible, its own accent + full message.
      const mark = status==='done' ? '✓' : status==='failed' ? '✗' : '↻';
      return `<div class="event fallback"><div class="event-top"><i class="event-kind"></i><span class="event-topic">回退 ${mark} · ${esc(event.topic||'')}</span><span class="event-time">${fmtTime(event.ts)}</span></div><div class="event-message">${esc(data.message||'')}</div></div>`;
    }
    const title=event.kind==='stage' ? `${data.stage || 'stage'} · ${status}` : event.kind;
    const message=data.detail||data.message||(event.kind==='run_status'?`calls ${data.calls||0} · tokens ${fmtNum(data.total_tokens)}`:'');
    return `<div class="event ${esc(status)}"><div class="event-top"><i class="event-kind"></i><span class="event-topic">${esc(event.topic||title)}</span><span class="event-time">${fmtTime(event.ts)}</span></div><div class="event-message">${esc(event.topic?title+(message?' · '+message:''):message||title)}</div></div>`;
  }).join('') : '<div class="empty">暂无事件</div>';
}

$('#docSearch').addEventListener('input',renderDocs);
$('#unitSearch').addEventListener('input',renderDetail);
$('#docList').addEventListener('click',event=>{ const row=event.target.closest('[data-topic]'); if(row){S.selected=row.dataset.topic;if(S.tab==='audit')loadAudit(S.selected);render();} });
$('#tabs').addEventListener('click',event=>{ const tab=event.target.closest('[data-tab]'); if(!tab)return; S.tab=tab.dataset.tab; document.querySelectorAll('.tab').forEach(node=>node.classList.toggle('active',node===tab)); if(S.tab==='audit')loadAudit(S.selected);renderDetail(); });
$('#unitList').addEventListener('click',async event=>{const button=event.target.closest('[data-decision]');if(!button)return;button.disabled=true;try{await api('/api/decisions/resolve',{decision_id:button.dataset.decision,action:button.dataset.action});delete S.audits[S.selected];await refreshState(true);toast('人工决策已保存');}catch(_){button.disabled=false;}});
$('#runBtn').addEventListener('click',async()=>{ try{await api('/api/run',{});S.running=true;renderHeader();toast('流水线已启动');}catch(_){} });
$('#exportBtn').addEventListener('click',async()=>{ try{const data=await api('/api/export',{});toast(`已导出 ${data.stats?.qa_units||0} 条 QA`);}catch(_){} });
$('#scanBtn').addEventListener('click',async()=>{try{const data=await api('/api/preflight/scan',{});await refreshState(true);toast(`预检完成：${data.summary?.awaiting_review||0} 项待人工确认`);}catch(_){}});
$('#retryBtn').addEventListener('click',async()=>{ if(!S.selected)return;try{await api('/api/retry',{topics:[S.selected]});S.running=true;renderHeader();toast(`已重试 ${S.selected}`);}catch(_){} });
$('#pinBtn').addEventListener('click',async()=>{ const doc=S.docs[S.selected];if(!doc)return;try{await api('/api/pin',{topic:doc.topic,pinned:!doc.pinned});doc.pinned=!doc.pinned;render();}catch(_){} });

let eventSource;
function connectEvents() {
  eventSource?.close(); eventSource=new EventSource('/api/events');
  eventSource.onopen=()=>setConnection('online','实时同步');
  eventSource.onmessage=message=>{try{onEvent(JSON.parse(message.data));}catch(error){console.error(error);}};
  eventSource.onerror=()=>setConnection('offline','连接中断，正在重连');
}

(async function boot(){ await refreshState(); connectEvents(); setInterval(()=>refreshState(true),15000); document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshState(true);}); })();
</script>
</body>
</html>
